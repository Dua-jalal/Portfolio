<!DOCTYPE html>
<html>
<head>
    <title>Color Changer Project</title>
    <style>
        body {
            text-align: center;
            padding-top: 100px;
            font-family: Arial, sans-serif;
            transition: background-color 0.5s;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>

    <h1 id="text">Button daba kar background color badlein!</h1>
    <button onclick="changeColor()">Change Color</button>

    <script>
        function changeColor() {
            // 1. Ek random color chun'ne ke liye colors ki list (Array)
            let colors = ["#FF5733", "#33FF57", "#3357FF", "#F3FF33", "#FF33F3", "#33FFF5"];
            
            // 2. Random number generate karna
            let randomIndex = Math.floor(Math.random() * colors.length);
            
            // 3. Body ka background color change karna
            document.body.style.backgroundColor = colors[randomIndex];
        }
    </script>

</body>
</html>
