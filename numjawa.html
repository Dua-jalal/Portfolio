
<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>checkNumber</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body">
            <h3 class="card-title text-center mb-4">Check num</h3>
            
            <div class="mb-3">
              <label for="userinput" class="form-label">Enter num</label>
              <input type="number" id="userinput" class="form-control" placeholder="e.g. 5 ya -3">
            </div>

            <button onclick="checkNumber()" class="btn btn-primary w-100">Result</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function checkNumber(){
      let intputVal = document.getElementById("userinput").value;
      if(intputVal ===""){
        console.log("Warning:enter the input");
        return;
      }
      let num = Number(intputVal);
      if(num>0){
        console.log(+num+ "the num is positive");
      }
      else if(num<0){
        console.log(+num+ "the num is negative");
      }
      else if(num==0){
        console.log(+num+ "The num is not postive or negative")
      }
      document.getElementById("userinput").value="";
    }
  </script>
  
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    
</body>
</html>
